<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#000000"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Human interface: a window with a header and content blocks -->
    <rect x="200" y="300" width="320" height="300" rx="12" stroke="#ffffff" stroke-width="4"/>
    <line x1="200" y1="350" x2="520" y2="350" stroke="#a3a3a3" stroke-width="2"/>
    <rect x="236" y="386" width="248" height="96" rx="12" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="236" y1="522" x2="420" y2="522" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="236" y1="558" x2="360" y2="558" stroke="#a3a3a3" stroke-width="2"/>
    <!-- Capability core: three capabilities in one boundary -->
    <rect x="660" y="310" width="280" height="280" rx="12" stroke="#ffffff" stroke-width="4"/>
    <rect x="770" y="350" width="60" height="60" rx="12" stroke="#ffffff" stroke-width="4"/>
    <rect x="770" y="420" width="60" height="60" rx="12" stroke="#ffffff" stroke-width="4"/>
    <rect x="770" y="490" width="60" height="60" rx="12" stroke="#ffffff" stroke-width="4"/>
    <!-- Agent client: plain structured lines -->
    <rect x="1080" y="340" width="320" height="220" rx="12" stroke="#ffffff" stroke-width="4"/>
    <line x1="1120" y1="390" x2="1300" y2="390" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="1120" y1="430" x2="1360" y2="430" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="1120" y1="470" x2="1260" y2="470" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="1120" y1="510" x2="1330" y2="510" stroke="#a3a3a3" stroke-width="2"/>
    <!-- Connections: human path gray, agent path turquoise -->
    <line x1="520" y1="450" x2="660" y2="450" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="940" y1="450" x2="1080" y2="450" stroke="#5cded6" stroke-width="4"/>
  </g>
  <circle cx="940" cy="450" r="10" fill="#5cded6"/>
  <circle cx="1080" cy="450" r="10" fill="#5cded6"/>
</svg>

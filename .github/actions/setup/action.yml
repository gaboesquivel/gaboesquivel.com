# No dependency cache: a Bun install cache restore (~720 MB, ~20 s) measured slower than a cold
# `bun install` (~8 s) on GitHub-hosted runners, and its save step added ~10 s on a miss.
name: Setup
description: Bun, Node 24, and dependencies.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - run: bun install --frozen-lockfile
      shell: bash

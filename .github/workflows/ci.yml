# Code quality only: oxlint and oxfmt on every PR.
name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Raster images and PDFs in public/ are most of the tree and neither check reads them.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/**/*.png
            !/public/**/*.jpg
            !/public/**/*.jpeg
            !/public/**/*.webp
            !/public/**/*.gif
            !/public/**/*.pdf
      - uses: ./.github/actions/setup
      - run: bunx oxlint
      - run: bunx oxfmt --check

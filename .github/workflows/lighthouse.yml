# Lighthouse on each successful Vercel preview (docs/specs/006). Mobile, median of 5 runs.
name: Lighthouse

on: deployment_status

concurrency:
  group: lighthouse-${{ github.event.deployment.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: perf
      - id: urls
        name: Build preview URLs
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          base="${PREVIEW_URL%/}"
          case "$base" in
            https://*.vercel.app) ;;
            *) echo "Unexpected preview URL" >&2; exit 1 ;;
          esac
          {
            echo "list<<EOF"
            jq -r --arg base "$base" '.[] | $base + .' perf/pages.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: perf/lighthouserc.json
          runs: 5
          temporaryPublicStorage: true
          uploadArtifacts: true

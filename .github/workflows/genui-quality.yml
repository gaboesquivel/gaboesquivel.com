name: GenUI quality

on:
  pull_request:
    paths:
      - "lib/genui/**"
      - "components/genui/**"
      - "app/api/genui/**"
      - "app/genui-lab/**"
      - "tests/genui/**"
      - "playwright.config.ts"
      - "promptfooconfig.yaml"
      - "package.json"
      - "bun.lock"
      - "scripts/**"
      - "lib/capabilities/**"
      - "lib/connect/**"
      - "lib/mcp/**"
      - ".github/actions/setup/**"
      - ".github/workflows/genui-quality.yml"
  # Playwright browser tests run on demand only.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, format, and content checks run in the CI workflow (ci.yml) in parallel.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Raster images and PDFs in public/ are ~160 MB of the ~170 MB tree and no check reads them
      # (Velite inlines public/**/*.svg, which stays). Partial clone; ~1 MB of public/ instead.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/**/*.png
            !/public/**/*.jpg
            !/public/**/*.jpeg
            !/public/**/*.webp
            !/public/**/*.gif
            !/public/**/*.pdf
      - uses: ./.github/actions/setup
      - run: bun run prepare:generated
      - run: bun run test:genui:unit
      - run: bun test lib/mcp/public-server.test.ts lib/mcp/cv-app.test.ts lib/capabilities/published-copy.test.ts lib/connect/calendar-lazy.test.ts

  browser:
    # e2e disabled; remove `false &&` and set PLAYWRIGHT_E2E=1 to re-enable.
    if: false && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run prepare:generated
      - run: bunx playwright install chromium --with-deps
      - run: bun run test:genui:browser
      - run: bun run test:genui:mcp-apps:host
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/genui/browser/report
            tests/genui/browser/test-results

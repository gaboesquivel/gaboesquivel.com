<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="676" viewBox="0 0 600 676" role="img" aria-labelledby="title desc">
  <title id="title">Coding factory delivery loop</title>
  <desc id="desc">A change moves from specification through verification and release, with retry and production feedback.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="676" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M300 88L300 128" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M300 204L300 244" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M300 320L300 360" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M300 436L300 476" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M300 532L300 572" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M450 282H520V166H450" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M150 610H40V60H150" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
    <g class="node"><rect x="150" y="32" width="300" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="300" y="60" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Specification</text></g><g class="node"><rect x="150" y="128" width="300" height="76" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="300" y="154" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Implementation</text><text x="300" y="178" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Isolated environment</text></g><g class="node"><rect x="150" y="244" width="300" height="76" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="300" y="270" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Verification</text><text x="300" y="294" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Tests + evidence</text></g><g class="node"><rect x="150" y="360" width="300" height="76" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="300" y="386" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Review gate</text><text x="300" y="410" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Human approval where required</text></g><g class="node"><rect x="150" y="476" width="300" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="300" y="504" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Release</text></g><g class="node"><rect x="150" y="572" width="300" height="76" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="300" y="598" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Production feedback</text><text x="300" y="622" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Signals + traces</text></g>
    <g class="chip"><rect x="457.5" y="213" width="53" height="22" rx="4" fill="#000000"/><text x="484" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Retry</text></g><g class="chip"><rect x="58" y="329" width="74" height="22" rx="4" fill="#000000"/><text x="95" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Feedback</text></g>
  </g>
</svg>

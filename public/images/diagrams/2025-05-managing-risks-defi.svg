<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="469" viewBox="0 0 600 469" role="img" aria-labelledby="title desc">
  <title id="title">DeFi dependency propagation</title>
  <desc id="desc">A failed oracle can propagate through lending and yield into a depositor. A bridge is a further dependency of the strategy.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#54e8b3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="469" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M450 84L450 124" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M450 180L450 228" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M300 256L350 256" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M450 284L450 332" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
    <g class="node"><rect x="360" y="28" width="180" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="450" y="56" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Price oracle</text></g><g class="node"><rect x="350" y="124" width="200" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="450" y="152" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Lending market</text></g><g class="node"><rect x="20" y="228" width="280" height="56" rx="8" fill="#111111" stroke="#404040" stroke-width="1.5"/><text x="160" y="256" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Bridge / external asset</text></g><g class="node"><rect x="350" y="228" width="200" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="450" y="256" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Yield strategy</text></g><g class="node"><rect x="365" y="332" width="170" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="450" y="360" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Depositor</text></g>
    <text class="note" x="300" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">A failure can propagate along the mint path</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="477" viewBox="0 0 640 477" role="img" aria-labelledby="title desc">
  <title id="title">Agentic commerce protocols</title>
  <desc id="desc">Commerce steps stay on one workflow. A2A, UCP, AP2, and x402 are separate protocol roles.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="477" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M512 92L512 132" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M512 188L512 228" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M512 284L512 324" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M256 256L400 256" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M256 352L400 352" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
    <g class="node"><rect x="400" y="36" width="224" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="512" y="64" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Buyer intent</text></g><g class="node"><rect x="400" y="132" width="224" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="512" y="160" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Product discovery</text></g><g class="node"><rect x="16" y="28" width="240" height="72" rx="8" fill="#111111" stroke="#404040" stroke-width="1.5"/><text x="136" y="52" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">A2A</text><text x="136" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Optional agent-to-agent</text></g><g class="node"><rect x="16" y="124" width="240" height="72" rx="8" fill="#111111" stroke="#5cded6" stroke-width="2"/><text x="136" y="148" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">UCP</text><text x="136" y="172" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Commerce workflow</text></g><g class="node"><rect x="16" y="220" width="240" height="72" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="136" y="244" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">AP2</text><text x="136" y="268" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Authorization and mandates</text></g><g class="node"><rect x="16" y="316" width="240" height="72" rx="8" fill="#111111" stroke="#404040" stroke-width="1.5"/><text x="136" y="340" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">x402</text><text x="136" y="364" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Optional settlement</text></g><g class="node"><rect x="400" y="228" width="224" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="512" y="256" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Checkout</text></g><g class="node"><rect x="400" y="324" width="224" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="512" y="352" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Order / fulfillment</text></g>
    <g class="chip"><rect x="273" y="221" width="110" height="22" rx="4" fill="#000000"/><text x="328" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Authorization</text></g><g class="chip"><rect x="283.5" y="317" width="89" height="22" rx="4" fill="#000000"/><text x="328" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Settlement</text></g><text class="note" x="320" y="439" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Not every purchase uses every protocol</text>
  </g>
</svg>

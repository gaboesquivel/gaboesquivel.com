<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Three levels of interface freedom</title>
  <desc id="desc">Selecting a known screen, composing approved parts, and generating a new structure each hand the result to trusted rendering.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g>
      <rect x="20" y="16" width="224" height="268" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/>
      <text x="36" y="42" fill="#a3a3a3" font-size="13">Select</text>
      <rect x="36" y="60" width="192" height="64" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/>
      <text x="132" y="84" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="16">Known screen</text>
      <text x="132" y="106" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="13">model chooses</text>
      <path d="M132 124V152" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
      <rect x="36" y="160" width="192" height="72" rx="8" fill="#111111" stroke="#54e8b3" stroke-width="2"/>
      <text x="132" y="186" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="16">Fixed interface</text>
      <text x="132" y="208" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="13">already designed</text>
      <text x="132" y="256" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="12">Least freedom</text>
    </g>
    <g>
      <rect x="268" y="16" width="224" height="268" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/>
      <text x="284" y="42" fill="#a3a3a3" font-size="13">Compose</text>
      <rect x="284" y="60" width="192" height="64" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/>
      <text x="380" y="84" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="16">Approved parts</text>
      <text x="380" y="106" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="13">model specifies</text>
      <path d="M380 124V152" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
      <rect x="284" y="160" width="192" height="72" rx="8" fill="#111111" stroke="#54e8b3" stroke-width="2"/>
      <text x="380" y="186" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="16">Renderer</text>
      <text x="380" y="208" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="13">trusted components</text>
      <text x="380" y="256" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="12">Bounded freedom</text>
    </g>
    <g>
      <rect x="516" y="16" width="224" height="268" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/>
      <text x="532" y="42" fill="#a3a3a3" font-size="13">Generate</text>
      <rect x="532" y="60" width="192" height="64" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/>
      <text x="628" y="84" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="16">New structure</text>
      <text x="628" y="106" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="13">model produces</text>
      <path d="M628 124V152" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
      <rect x="532" y="160" width="192" height="72" rx="8" fill="#111111" stroke="#54e8b3" stroke-width="2"/>
      <text x="628" y="186" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="16">Checked output</text>
      <text x="628" y="208" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="13">then rendered</text>
      <text x="628" y="256" text-anchor="middle" dominant-baseline="central" fill="#a3a3a3" font-size="12">Most freedom</text>
    </g>
  </g>
</svg>

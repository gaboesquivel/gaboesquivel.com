<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="332" viewBox="0 0 640 332" role="img" aria-labelledby="title desc">
  <title id="title">Iteration feedback loop</title>
  <desc id="desc">Learning loop from idea through preview, review, rollout, measurement, and the next decision, with a rollback branch.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#54e8b3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="332" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M184 60L220 60" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M360 60L396 60" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M462 88L462 132" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M364 160L328 160" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M256 188V216H144V248" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M56 276H28V60H64" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M462 188L462 248" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
    <g class="node"><rect x="64" y="32" width="120" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="124" y="60" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Idea</text></g><g class="node"><rect x="220" y="32" width="140" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="290" y="60" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Preview</text></g><g class="node"><rect x="396" y="32" width="132" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="462" y="60" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Review</text></g><g class="node"><rect x="364" y="132" width="196" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="462" y="160" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Gradual rollout</text></g><g class="node"><rect x="184" y="132" width="144" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="256" y="160" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Measure</text></g><g class="node"><rect x="56" y="248" width="176" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="144" y="276" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Next decision</text></g><g class="node"><rect x="364" y="248" width="196" height="56" rx="8" fill="#111111" stroke="#404040" stroke-width="1.5"/><text x="462" y="276" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Pause / rollback</text></g>
    <g class="chip"><rect x="45" y="157" width="110" height="22" rx="4" fill="#000000"/><text x="100" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Learning loop</text></g><g class="chip"><rect x="441" y="203" width="118" height="22" rx="4" fill="#000000"/><text x="500" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Failure signal</text></g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" role="img" aria-labelledby="title desc">
  <title id="title">Intent fulfillment lanes</title>
  <desc id="desc">The user signs an outcome. Solvers choose the route. Source funds and destination fulfillment meet at verification.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="444" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M380 84L380 120" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M380 176V206H159V236" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M380 176V206H491V236" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M159 312V336H160V360" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M491 312L491 360" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M250 388L406 388" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
    <g class="node"><rect x="200" y="28" width="360" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="380" y="56" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Signed outcome + constraints</text></g><g class="node"><rect x="200" y="120" width="360" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="380" y="148" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Selects a fulfillment route</text></g><g class="node"><rect x="24" y="236" width="270" height="76" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="159" y="262" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Funds + authorization</text><text x="159" y="286" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Source chain</text></g><g class="node"><rect x="366" y="236" width="250" height="76" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="491" y="262" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Solver fulfillment</text><text x="491" y="286" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Destination chain</text></g><g class="node"><rect x="70" y="360" width="180" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="160" y="388" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Verification</text></g><g class="node"><rect x="406" y="360" width="170" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="491" y="388" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Settlement</text></g>
    <text class="note" x="24" y="59" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">User</text><text class="note" x="24" y="151" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">Solver network</text>
  </g>

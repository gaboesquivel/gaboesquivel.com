<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="513" viewBox="0 0 640 513" role="img" aria-labelledby="title desc">
  <title id="title">Fiat-backed stablecoin lifecycle</title>
  <desc id="desc">Fiat backing and reserves stay offchain. Issuance, transfer, and redemption move the onchain token.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="513" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g class="group"><rect x="16" y="24" width="248" height="236" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/><text x="32" y="46" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">Offchain reserve / custody</text></g><g class="group"><rect x="360" y="24" width="264" height="424" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/><text x="376" y="46" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">Onchain transfers</text></g>
    <path d="M134 124L134 168" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M236 196L374 196" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M492 224L492 268" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M492 324L492 368" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M492 424V496H90V224" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
    <g class="node"><rect x="32" y="68" width="204" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="134" y="96" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Fiat backing</text></g><g class="node"><rect x="32" y="168" width="204" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="134" y="196" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Issuer / reserves</text></g><g class="node"><rect x="374" y="168" width="236" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="492" y="196" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Token issuance</text></g><g class="node"><rect x="374" y="268" width="236" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="492" y="296" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Transfers / payments</text></g><g class="node"><rect x="374" y="368" width="236" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="492" y="396" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Redemption</text></g>
    <g class="chip"><rect x="275" y="163" width="74" height="22" rx="4" fill="#000000"/><text x="312" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Issuance</text></g><g class="chip"><rect x="235.5" y="463" width="89" height="22" rx="4" fill="#000000"/><text x="280" y="474" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Redemption</text></g>
  </g>
</svg>

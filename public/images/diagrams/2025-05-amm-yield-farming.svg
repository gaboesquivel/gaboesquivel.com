<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="471" viewBox="0 0 620 471" role="img" aria-labelledby="title desc">
  <title id="title">AMM pool flows</title>
  <desc id="desc">Liquidity providers deposit reserves, traders swap against the pool, and fees return to providers. Farming incentives are optional.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="620" height="471" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M216 88V168" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M420 206H352" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M300 244V280H600V60H336" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M96 356H24V60H96" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
    <g class="node"><rect x="96" y="32" width="240" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="216" y="60" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Liquidity providers</text></g><g class="node"><rect x="420" y="178" width="150" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="495" y="206" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Traders</text></g><g class="node"><rect x="80" y="168" width="272" height="76" rx="8" fill="#111111" stroke="#5cded6" stroke-width="2"/><text x="216" y="194" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Token reserves / pool</text><text x="216" y="218" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">x × y = k</text></g><g class="node"><rect x="96" y="320" width="240" height="72" rx="8" fill="#111111" stroke="#404040" stroke-width="1.5"/><text x="216" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Farming incentives</text><text x="216" y="368" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">optional</text></g>
    <g class="chip"><rect x="243" y="117" width="74" height="22" rx="4" fill="#000000"/><text x="280" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Deposits</text></g><g class="chip"><rect x="359.5" y="175" width="53" height="22" rx="4" fill="#000000"/><text x="386" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Swaps</text></g><g class="chip"><rect x="409" y="251" width="82" height="22" rx="4" fill="#000000"/><text x="450" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">Swap fees</text></g><text class="note" x="320" y="433" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Constant-product example, not every AMM</text>
  </g>
</svg>

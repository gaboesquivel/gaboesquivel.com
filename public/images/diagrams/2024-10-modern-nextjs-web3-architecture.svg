<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="528" viewBox="0 0 640 528" role="img" aria-labelledby="title desc">
  <title id="title">Cached reads and wallet writes</title>
  <desc id="desc">Reads flow through the query cache to an indexer or RPC. A confirmed write invalidates that cache. viem is the chain client under the query layer.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#54e8b3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="528" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g class="group"><rect x="16" y="20" width="300" height="400" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/><text x="32" y="42" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">Read path</text></g><g class="group"><rect x="324" y="20" width="300" height="480" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/><text x="340" y="42" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">Write path</text></g>
    <path d="M166 120L166 152" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M166 208L166 240" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M166 316L166 328" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M474 116L474 144" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M474 200L474 228" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M474 284L474 312" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M474 368L474 396" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M348 424H320V278H292" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
    <g class="node"><rect x="40" y="64" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="166" y="92" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">URL / route state</text></g><g class="node"><rect x="40" y="152" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="166" y="180" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Next.js view</text></g><g class="node"><rect x="40" y="240" width="252" height="76" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="166" y="266" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">TanStack Query / wagmi</text><text x="166" y="290" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">viem chain client</text></g><g class="node"><rect x="40" y="328" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="166" y="356" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Indexer API or RPC</text></g><g class="node"><rect x="348" y="60" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="474" y="88" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">User action</text></g><g class="node"><rect x="348" y="144" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="474" y="172" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Wallet signature</text></g><g class="node"><rect x="348" y="228" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="474" y="256" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Blockchain transaction</text></g><g class="node"><rect x="348" y="312" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="474" y="340" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Confirmation</text></g><g class="node"><rect x="348" y="396" width="252" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="474" y="424" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Query invalidation</text></g>
    
  </g>
</svg>

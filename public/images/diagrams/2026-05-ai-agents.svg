    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="568" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M320 84L320 124" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M220 200V240H147V268" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M320 200V234H316V268" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M396 296L428 296" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M316 324L316 376" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M316 432L316 484" fill="none" stroke="#54e8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M191 510H24V162H160" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
    <g class="node"><rect x="200" y="28" width="240" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="320" y="56" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Application / user</text></g><g class="node"><rect x="160" y="124" width="320" height="76" rx="8" fill="#111111" stroke="#54e8b3" stroke-width="2"/><text x="320" y="150" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Agent harness</text><text x="320" y="174" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Requests / responses</text></g><g class="node"><rect x="72" y="268" width="150" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="147" y="296" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Model</text></g><g class="node"><rect x="236" y="268" width="160" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="316" y="296" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Runtime</text></g><g class="node"><rect x="428" y="268" width="196" height="56" rx="8" fill="#111111" stroke="#404040" stroke-width="1.5"/><text x="526" y="296" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">State + recovery</text></g><g class="node"><rect x="211" y="376" width="210" height="56" rx="8" fill="#111111" stroke="#54e8b3" stroke-width="2"/><text x="316" y="404" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Permission gate</text></g><g class="node"><rect x="191" y="484" width="250" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="316" y="512" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">External tools / APIs</text></g>

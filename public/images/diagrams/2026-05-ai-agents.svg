<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="568" viewBox="0 0 640 568" role="img" aria-labelledby="title desc">
  <title id="title">Agent production boundary</title>
  <desc id="desc">The harness coordinates the model and runtime. The permission gate sits outside the model, before external tools.</desc>

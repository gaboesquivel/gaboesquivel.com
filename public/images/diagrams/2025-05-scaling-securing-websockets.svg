<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="528" viewBox="0 0 640 528" role="img" aria-labelledby="title desc">
  <title id="title">Multi-node WebSocket messaging</title>
  <desc id="desc">Clients pass handshake authentication and a TLS load balancer. Redis pub/sub carries a message from node A to a client on node B.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="528" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M147 80V98H250V116" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M493 80V98H420V116" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M320 172L320 212" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M320 268V292H148V316" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M320 268V292H492V316" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M148 372V400H320V428" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M320 500V408H492V316" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M592 344H616V52H568" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
    <g class="node"><rect x="72" y="24" width="150" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="147" y="52" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Client A</text></g><g class="node"><rect x="418" y="24" width="150" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="493" y="52" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Client B</text></g><g class="node"><rect x="160" y="116" width="320" height="56" rx="8" fill="#111111" stroke="#5cded6" stroke-width="2"/><text x="320" y="144" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Handshake authentication</text></g><g class="node"><rect x="205" y="212" width="230" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="320" y="240" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">TLS load balancer</text></g><g class="node"><rect x="48" y="316" width="200" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="148" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">WebSocket node A</text></g><g class="node"><rect x="392" y="316" width="200" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="492" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">WebSocket node B</text></g><g class="node"><rect x="240" y="428" width="160" height="72" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="320" y="452" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Redis</text><text x="320" y="476" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">pub/sub</text></g>
    <g class="chip"><rect x="512" y="169" width="96" height="22" rx="4" fill="#000000"/><text x="560" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#a3a3a3">To client B</text></g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="332" viewBox="0 0 640 332" role="img" aria-labelledby="title desc">
  <title id="title">Order book and AMM</title>
  <desc id="desc">An order book matches bids and asks. An AMM quotes a trade against a liquidity pool.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="332" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g class="group"><rect x="16" y="24" width="300" height="280" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/><text x="32" y="46" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">Order book</text></g><g class="group"><rect x="328" y="24" width="300" height="280" rx="12" fill="none" stroke="#404040" stroke-width="1.5"/><text x="344" y="46" text-anchor="start" dominant-baseline="central" font-size="13" fill="#a3a3a3">AMM</text></g>
    <path d="M96 144V178H166V212" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M244 144V178H166V212" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M474 148L474 212" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
    <g class="node"><rect x="28" y="88" width="136" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="96" y="116" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Bid orders</text></g><g class="node"><rect x="176" y="88" width="136" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="244" y="116" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Ask orders</text></g><g class="node"><rect x="56" y="212" width="220" height="56" rx="8" fill="#111111" stroke="#5cded6" stroke-width="2"/><text x="166" y="240" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Matching</text></g><g class="node"><rect x="384" y="92" width="180" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="474" y="120" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Trader</text></g><g class="node"><rect x="352" y="212" width="244" height="76" rx="8" fill="#111111" stroke="#5cded6" stroke-width="2"/><text x="474" y="238" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Liquidity pool</text><text x="474" y="262" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">Contract-defined pricing</text></g>
    
  </g>

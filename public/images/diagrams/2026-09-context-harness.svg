<svg xmlns="http://www.w3.org/2000/svg" width="640" height="476" viewBox="0 0 640 476" role="img" aria-labelledby="title desc">
  <title id="title">The harness orchestrates context</title>
  <desc id="desc">The harness selects context from the current task, instructions, skills, and retrieved information. It recalls and writes long-term memory. It sends context to the model, receives a response or tool request, dispatches tools in the runtime, and feeds their results into the next model call.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="476" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" dominant-baseline="central">
    <g fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)">
      <path d="M160 124V196" marker-start="url(#arrow-mint)"/>
      <path d="M480 124V196"/>
      <path d="M100 300V372"/>
      <path d="M220 372V300"/>
      <path d="M420 300V372"/>
      <path d="M540 372V300"/>
    </g>
    <g fill="#111111" stroke="#555555" stroke-width="1.5">
      <rect x="40" y="24" width="240" height="96" rx="8"/>
      <rect x="360" y="24" width="240" height="96" rx="8"/>
      <rect x="40" y="200" width="560" height="96" rx="8" stroke="#5cded6"/>
      <rect x="40" y="376" width="240" height="76" rx="8"/>
      <rect x="360" y="376" width="240" height="76" rx="8"/>
    </g>
    <g font-size="16" fill="#ffffff">
      <text x="160" y="52">Long-term memory</text>
      <text x="480" y="52">Task + resources</text>
      <text x="320" y="228" fill="#5cded6">Harness</text>
      <text x="160" y="402">Model</text>
      <text x="480" y="402">Tools / runtime</text>
    </g>
    <g font-size="13" fill="#a3a3a3">
      <text x="160" y="78">Facts and past</text><text x="160" y="98">experiences</text>
      <text x="480" y="78">History, skills,</text><text x="480" y="98">instructions, docs</text>
      <text x="320" y="254">Assemble context · call the model</text><text x="320" y="274">Route tools · update working state</text>
      <text x="160" y="426">Choose next step</text>
      <text x="480" y="426">Execute actions</text>
    </g>
    <g font-size="12" fill="#a3a3a3">
      <rect x="88" y="149" width="144" height="22" rx="4" fill="#000000"/><text x="160" y="160">Recall / write back</text>
      <rect x="452" y="149" width="56" height="22" rx="4" fill="#000000"/><text x="480" y="160">Select</text>
      <rect x="68" y="325" width="64" height="22" rx="4" fill="#000000"/><text x="100" y="336">Context</text>
      <rect x="148" y="325" width="144" height="22" rx="4" fill="#000000"/><text x="220" y="336">Response / tool call</text>
      <rect x="384" y="325" width="72" height="22" rx="4" fill="#000000"/><text x="420" y="336">Dispatch</text>
      <rect x="508" y="325" width="64" height="22" rx="4" fill="#000000"/><text x="540" y="336">Results</text>
    </g>
  </g>
</svg>

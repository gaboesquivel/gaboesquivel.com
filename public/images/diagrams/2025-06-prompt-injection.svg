<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">Prompt injection trust boundary</title>
  <desc id="desc">Untrusted content enters model context beside trusted instructions. An application gate sits before any external action.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5cded6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="560" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    
    <path d="M151 104V132H270V164" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M479 104V132H370V164" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/><path d="M320 220L320 268" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M320 324L320 372" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/><path d="M320 428L320 476" fill="none" stroke="#5cded6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
    <g class="node"><rect x="36" y="32" width="230" height="72" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="151" y="56" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Trusted application</text><text x="151" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">instructions</text></g><g class="node"><rect x="354" y="32" width="250" height="72" rx="8" fill="#111111" stroke="#404040" stroke-width="1.5"/><text x="479" y="56" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Untrusted document</text><text x="479" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#a3a3a3">website / tool result</text></g><g class="node"><rect x="210" y="164" width="220" height="56" rx="8" fill="#111111" stroke="#5cded6" stroke-width="2"/><text x="320" y="192" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Model context</text></g><g class="node"><rect x="190" y="268" width="260" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="320" y="296" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Proposed tool action</text></g><g class="node"><rect x="140" y="372" width="360" height="56" rx="8" fill="#111111" stroke="#5cded6" stroke-width="2"/><text x="320" y="400" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">Application authorization gate</text></g><g class="node"><rect x="210" y="476" width="220" height="56" rx="8" fill="#111111" stroke="#555555" stroke-width="1.5"/><text x="320" y="504" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#ffffff">External system</text></g>
    
  </g>
</svg>
